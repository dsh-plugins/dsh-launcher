[package]
name = "dsh-office"
version = "0.1.0"
edition = "2021"
description = "Bounded Rust-only Office document tools over MCP stdio"
license = "MIT"

[dependencies]
cap-std = "3.4"
roxmltree = "0.20"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
